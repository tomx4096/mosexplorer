<!doctype html>
<html lang="en" data-theme="night">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Saira+Stencil+One&display=swap"
			rel="stylesheet"
		/>
		<script>
			try {
				var q = new URLSearchParams(location.search).get('theme');
				var t = q || localStorage.getItem('mos-theme');
				if (t === 'day' || t === 'night') {
					document.documentElement.setAttribute('data-theme', t);
					if (q) localStorage.setItem('mos-theme', t);
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
